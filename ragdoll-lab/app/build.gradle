plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mcxendo.ragdolllab'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mcxendo.ragdolllab'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly.
            // Replace with your own keystore before publishing to a store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
