name: Build Bliss (Android)

on:
  push:
    paths:
      - 'bliss/**'
      - '.github/workflows/bliss-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bliss-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bliss
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bliss/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: bliss/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../Bliss.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bliss-apk
          path: Bliss.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bliss-build-${{ github.run_number }}
          name: Bliss (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Tap **Bliss.apk** below on your Android phone to download and install it.
          files: Bliss.apk
          make_latest: true
