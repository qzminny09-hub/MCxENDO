name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - "docs/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HandTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HandTracker
          path: HandTracker.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hand-tracker-${{ github.run_number }}
          name: Hand Tracker build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: HandTracker.apk
          body: |
            Download **HandTracker.apk** below on your Android phone, open it, and allow installing from this source when asked.
