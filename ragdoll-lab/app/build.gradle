plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mcxendo.ragdolllab'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mcxendo.ragdolllab'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // A fixed key kept in the repo so every CI build can be installed over the previous one.
    // It is NOT secret - use your own private keystore before publishing to a store.
    signingConfigs {
        lab {
            storeFile file('ragdoll-lab.keystore')
            storePassword 'ragdolllab'
            keyAlias 'ragdolllab'
            keyPassword 'ragdolllab'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.lab
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
